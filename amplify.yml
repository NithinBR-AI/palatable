version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - export NODE_OPTIONS='--max-old-space-size=6000'
        - export npm_config_registry=https://registry.npmjs.org
        - npm install --legacy-peer-deps --loglevel verbose
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
