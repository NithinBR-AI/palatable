version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm config set registry https://registry.npmjs.org
        - npm config get registry
        - cat ~/.npmrc
        - export NODE_OPTIONS='--max-old-space-size=6000'
        - npm install --legacy-peer-deps --loglevel verbose
    build:
      commands:
        - env | grep -e MANTLE_API_KEY -e MANTLE_BASE_URL -e MANTLE_MODEL -e QLOO_API_KEY -e QLOO_API_BASE_URL -e DB_REGION -e DB_ACCESS_KEY_ID -e DB_SECRET_ACCESS_KEY >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
